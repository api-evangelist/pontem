name: Pontem
description: 'Pontem is a Web3 product development studio building with the Move language on Aptos and other Layer 1 blockchains, in partnership with Aptos Labs. Its product portfolio spans the Pontem Wallet (a browser-extension and mobile crypto wallet for APT, MOVE, ETH, SOL and more), the Liquidswap decentralized exchange and AMM, the Lumio L2 VM-abstraction framework, and a Move developer tooling suite that includes the Move Code Playground, the IntelliJ Move IDE plugin, the ByteBabel Solidity-to-Move bytecode translator, and the Dove Move package manager. Pontem publishes first-party TypeScript SDKs, an embeddable Liquidswap web-component widget, wallet adapters, and CLIs. Backed by Pantera Capital, Animoca Brands, and Aptos Labs.'
